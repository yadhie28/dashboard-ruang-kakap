name: Auto Sync Spreadsheet & Sensus WhatsApp Kakap

on:
  # Jadwal Pengiriman Laporan Sensus WA Ruang Kakap 3x Sehari:
  # 00:00 UTC = 07:00 WIB (Shift Pagi)
  # 07:00 UTC = 14:00 WIB (Shift Sore)
  # 13:00 UTC = 20:00 WIB (Shift Malam)
  schedule:
    - cron: '0 0,7,13 * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Paksa kirim WhatsApp mengabaikan jam jadwal (Uji Coba)'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main

# Izin untuk menulis ke GitHub Pages dan commit pembaruan data
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Spreadsheet Kakap & Build Data
        run: |
          python run_build_data.py --download

      - name: Kirim Laporan Sensus WhatsApp ke Kepala Ruang Kakap
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-wa]')
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN || 'Ayfow2x1hFiscQZSphzq' }}
          IS_TEST_TRIGGER: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-wa]') }}
        run: |
          if [ "$IS_TEST_TRIGGER" = "true" ]; then
            echo "[TEST MODE] Uji coba pengiriman Cloud GitHub Actions dengan flag --force..."
            python send_whatsapp.py --sensus --force --gateway fonnte
          else
            echo "[SCHEDULED MODE] Pengiriman sensus terjadwal resmi..."
            python send_whatsapp.py --sensus --scheduled-only --gateway fonnte || echo "WhatsApp dispatch finished with warning"
          fi

      - name: Commit Updated Data to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Auto-Sync"
          git add dashboard_data.json hospital_indicators.json kakap_data.xlsx shift_sent_wa.json
          git commit -m "chore(auto-sync): update daily census & WA dispatch Ruang Kakap [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
