<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradKakap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#gradKakap)" filter="url(#glow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Shield / Cross Center -->
  <path d="M100 35 L145 60 V105 C145 135 125 158 100 168 C75 158 55 135 55 105 V60 Z" fill="#ffffff" opacity="0.95" />

  <!-- Medical Cross Inside Shield -->
  <path d="M92 68 H108 V88 H128 V104 H108 V124 H92 V104 H72 V88 H92 Z" fill="#0284c7" />

  <!-- Waves / Marine Accent representing Kakap -->
  <path d="M65 138 C75 132 85 142 95 138 C105 134 115 142 125 138 C130 136 135 134 140 137" fill="none" stroke="url(#goldAcc)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M70 148 C80 143 90 151 100 147 C110 143 120 151 130 147" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />

  <!-- Stars -->
  <circle cx="100" cy="50" r="3.5" fill="url(#goldAcc)" />
  <circle cx="85" cy="53" r="2.5" fill="url(#goldAcc)" />
  <circle cx="115" cy="53" r="2.5" fill="url(#goldAcc)" />
</svg>

