<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#034d75" />
      <stop offset="85%" stop-color="#091e32" />
      <stop offset="100%" stop-color="#051321" />
    </radialGradient>

    <!-- Snapper Fish Coral Red Gradient -->
    <linearGradient id="kakapBodyGrad" x1="15%" y1="20%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Snapper Belly Highlight (Golden Coral) -->
    <linearGradient id="kakapBellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Gold Accent Ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Aqua Waves Gradient -->
    <linearGradient id="waveAqua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="fishShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circular Badge -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGlow)" filter="url(#badgeGlow)" />

  <!-- Outer Ring with Tech Dashes -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#goldRing)" stroke-width="3" opacity="0.85" />
  <circle cx="128" cy="128" r="109" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.55" />

  <!-- Background Water Flow & Medical Cross Emblem -->
  <g opacity="0.18">
    <circle cx="128" cy="128" r="95" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="128" cy="128" r="75" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,4" />
  </g>

  <!-- Medical Cross Badge (Top Right Clinical Anchor) -->
  <g transform="translate(166, 42) scale(0.72)" filter="url(#fishShadow)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" />
    <circle cx="20" cy="20" r="19" fill="#0284c7" />
    <!-- White Cross -->
    <path d="M16 8 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 v-8 h8 z" fill="#ffffff" />
  </g>

  <!-- Fluid Oceanic Waves (Beneath Fish) -->
  <path d="M22 178 Q 65 145 120 172 T 228 165 C 235 185 220 215 180 232 C 140 248 85 242 45 220 Z" fill="url(#waveAqua)" opacity="0.35" />
  <path d="M18 190 C 58 165 98 190 148 180 C 190 172 215 188 238 180 C 230 205 200 235 155 244 C 105 252 50 235 18 190 Z" fill="url(#waveAqua)" opacity="0.5" />
  <path d="M28 200 Q 80 182 135 198 T 225 190" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- ============================================================ -->
  <!-- IKAN KAKAP MERAH (RED SNAPPER) - HIGH FIDELITY EMBLEM        -->
  <!-- ============================================================ -->
  <g filter="url(#fishShadow)">

    <!-- SPINDLE / SPINY DORSAL FIN (Sirip Punggung Berduri Khas Kakap) -->
    <path d="M 82 78 
             Q 92 48 100 42 
             L 106 58 
             Q 116 40 126 36 
             L 130 54 
             Q 142 42 154 44 
             L 156 60 
             Q 168 52 178 58 
             L 174 74 
             Q 186 70 192 78 
             L 182 88 
             Q 175 92 165 88 
             C 145 84 110 82 82 78 Z" 
          fill="url(#finGrad)" stroke="#fef08a" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Spiny Fin Rays (Garis Tulang Sirip Punggung) -->
    <path d="M 86 78 L 100 42 
             M 108 77 L 126 36 
             M 132 79 L 154 44 
             M 156 82 L 178 58
             M 172 85 L 192 78" 
          stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

    <!-- PELVIC / ANAL FIN (Sirip Bawah / Anal) -->
    <path d="M 148 160 Q 165 178 178 180 Q 172 165 168 152 Z" fill="url(#finGrad)" stroke="#fca5a5" stroke-width="1" />
    <path d="M 102 166 Q 112 186 122 188 Q 118 172 114 162 Z" fill="url(#finGrad)" stroke="#fca5a5" stroke-width="1" />

    <!-- CAUDAL FIN (Sirip Ekor Perkasa Bercabang Khas Kakap) -->
    <path d="M 198 126 
             C 214 112 232 94 244 86 
             C 240 106 232 120 224 128 
             C 234 136 244 152 248 172 
             C 234 164 214 146 198 136 Z" 
          fill="url(#finGrad)" stroke="url(#goldRing)" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Caudal Fin Texture Rays -->
    <path d="M 200 130 Q 220 108 242 88
             M 202 131 Q 218 116 230 110
             M 202 132 Q 215 128 224 128
             M 202 133 Q 220 142 234 148
             M 200 134 Q 222 154 244 168" 
          stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

    <!-- MAIN BODY (Tubuh Ikan Kakap Merah Atletis & Berotot) -->
    <!-- Head at left (46, 126), high curved back (120, 80), taper to tail (198, 131), belly (120, 166) -->
    <path d="M 46 126 
             C 52 110 68 92 88 84 
             C 112 74 148 76 174 88 
             C 188 96 195 112 200 131 
             C 194 144 184 154 168 158 
             C 140 166 108 168 84 156 
             C 64 146 50 136 46 126 Z" 
          fill="url(#kakapBodyGrad)" />

    <!-- BELLY ACCENT (Gradasi Perut Kakap Emas Kemerahan) -->
    <path d="M 46 126 
             C 54 134 72 152 98 158 
             C 126 164 160 160 178 148 
             C 188 142 196 135 200 131 
             C 192 144 178 155 162 160 
             C 134 167 102 167 80 155 
             C 62 145 50 135 46 126 Z" 
          fill="url(#kakapBellyGrad)" opacity="0.85" />

    <!-- CHARACTERISTIC LATERAL LINE (Garis Rusuk Sensorik Khas Ikan) -->
    <path d="M 76 122 Q 130 114 196 131" 
          fill="none" stroke="url(#goldRing)" stroke-width="2.2" stroke-dasharray="4,2" opacity="0.8" />

    <!-- SCALES SHIMMER PATTERN (Tekstur Sisik Halus Mengkilap) -->
    <g opacity="0.25" stroke="#ffffff" stroke-width="1" fill="none">
      <path d="M 98 96 Q 106 102 114 96 M 116 96 Q 124 102 132 96 M 134 96 Q 142 102 150 96" />
      <path d="M 92 106 Q 100 112 108 106 M 110 106 Q 118 112 126 106 M 128 106 Q 136 112 144 106 M 146 106 Q 154 112 162 106" />
      <path d="M 88 116 Q 96 122 104 116 M 106 116 Q 114 122 122 116 M 124 116 Q 132 122 140 116 M 142 116 Q 150 122 158 116" />
      <path d="M 96 126 Q 104 132 112 126 M 114 126 Q 122 132 130 126 M 132 126 Q 140 132 148 126 M 150 126 Q 158 132 166 126" />
      <path d="M 104 136 Q 112 142 120 136 M 122 136 Q 130 142 138 136 M 140 136 Q 148 142 156 136" />
    </g>

    <!-- OPERCULUM / GILL COVER (Tutup Insang Tegas) -->
    <path d="M 74 100 C 86 106 90 122 84 140 C 80 146 75 148 70 146" 
          fill="none" stroke="#7f1d1d" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 72 102 C 82 108 86 122 80 138" 
          fill="none" stroke="url(#goldRing)" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

    <!-- PECTORAL FIN (Sirip Dada Anggun Menghadap ke Belakang) -->
    <path d="M 82 126 
             C 96 122 122 126 134 134 
             C 126 142 108 144 92 140 
             C 86 138 82 132 82 126 Z" 
          fill="url(#finGrad)" stroke="#fca5a5" stroke-width="1.2" filter="url(#fishShadow)" />
    <!-- Pectoral Fin Rays -->
    <path d="M 86 128 Q 110 130 130 134
             M 88 132 Q 106 135 124 138" 
          stroke="#fef08a" stroke-width="1" opacity="0.8" />

    <!-- HEAD & JAW DETAIL (Rahang & Mulut Tajam Khas Kakap) -->
    <!-- Upper and Lower Jaw Definition -->
    <path d="M 46 126 L 56 128" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
    <path d="M 46 126 C 44 124 45 121 48 120 L 58 116" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" />

    <!-- EYE (Mata Ikan Kakap - Bulat, Hidup, Emas & Bercahaya) -->
    <circle cx="64" cy="110" r="8.5" fill="#1e293b" stroke="url(#goldRing)" stroke-width="2.2" />
    <circle cx="64" cy="110" r="6.2" fill="#d97706" />
    <circle cx="64" cy="110" r="4.2" fill="#000000" />
    <!-- Eye Light Catch Reflex (Kilau Cahaya Mata) -->
    <circle cx="62" cy="108" r="2.2" fill="#ffffff" />
    <circle cx="66" cy="112" r="1.0" fill="#ffffff" opacity="0.8" />

    <!-- Forehead Golden Sheen Accent -->
    <path d="M 52 118 Q 65 98 84 90" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.65" stroke-linecap="round" />
  </g>

  <!-- Bubbles / Water Sparkles (Efek Dinamis Air) -->
  <circle cx="36" cy="108" r="3.2" fill="#38bdf8" opacity="0.75" />
  <circle cx="30" cy="118" r="2.0" fill="#bae6fd" opacity="0.6" />
  <circle cx="42" cy="96" r="2.2" fill="#ffffff" opacity="0.8" />

  <!-- Bottom Arch Text Ribbon (Optional Medical Inscription) -->
  <g transform="translate(128, 240)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="#fef08a" opacity="0.95">
      RUANG KAKAP • RSUD DR. SOEDARSO
    </text>
  </g>
</svg>
